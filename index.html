<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e7">
    <meta
      name="description"
      content="Interaktyvus Vištyčio regioninio parko lankytinų vietų žemėlapis."
    >
    <title>Vištytis | Interaktyvus žemėlapis</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <style>
      :root {
        --ink: #1d3030;
        --muted: #6e7c78;
        --paper: rgba(250, 248, 242, 0.96);
        --paper-solid: #faf8f2;
        --line: rgba(29, 48, 48, 0.12);
        --shadow: 0 1.2rem 3.5rem rgba(30, 47, 47, 0.16);
        --green: #2f6861;
        --green-dark: #1e4d49;
        --map-bg: #d7e2dc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background: var(--map-bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      #map {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: var(--map-bg);
      }

      .leaflet-tile-pane {
        filter: saturate(0.72) sepia(0.08);
      }

      .topbar {
        position: absolute;
        z-index: 1000;
        top: 1rem;
        right: 1rem;
        left: 1rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        max-width: 1180px;
        margin: 0 auto;
        pointer-events: none;
      }

      .topbar > * {
        pointer-events: auto;
      }

      .brand {
        display: flex;
        flex-direction: column;
        min-width: 12rem;
        padding: 0.7rem 0.9rem;
        color: var(--paper-solid);
        background: linear-gradient(135deg, var(--green-dark), var(--green));
        border-radius: 0.75rem;
        box-shadow: var(--shadow);
        text-decoration: none;
      }

      .brand strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.28rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand span {
        margin-top: 0.12rem;
        color: rgba(250, 248, 242, 0.74);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .search-box {
        display: flex;
        flex: 1 1 20rem;
        align-items: center;
        max-width: 31rem;
        padding: 0 0.8rem;
        background: var(--paper);
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 0.75rem;
        box-shadow: var(--shadow);
      }

      .search-icon {
        width: 1rem;
        height: 1rem;
        margin-right: 0.55rem;
        color: var(--green);
      }

      .search-box input {
        width: 100%;
        min-width: 0;
        padding: 0.85rem 0;
        color: var(--ink);
        background: transparent;
        border: 0;
        outline: 0;
      }

      .search-box input::placeholder {
        color: #8a9690;
      }

      .top-actions {
        display: flex;
        gap: 0.45rem;
        margin-left: auto;
      }

      .icon-button,
      .text-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.7rem;
        padding: 0 0.75rem;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 0.7rem;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, color 160ms ease;
      }

      .icon-button {
        width: 2.7rem;
        padding: 0;
      }

      .icon-button svg {
        width: 1.15rem;
        height: 1.15rem;
      }

      .text-button {
        gap: 0.4rem;
        font-size: 0.79rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .icon-button:hover,
      .text-button:hover,
      .place-card:hover {
        transform: translateY(-1px);
      }

      .icon-button:focus-visible,
      .text-button:focus-visible,
      .filter-button:focus-visible,
      .place-card:focus-visible,
      .close-button:focus-visible {
        outline: 3px solid rgba(47, 104, 97, 0.28);
        outline-offset: 2px;
      }

      .panel {
        position: absolute;
        z-index: 900;
        top: 6.1rem;
        bottom: 1rem;
        left: 1rem;
        display: flex;
        flex-direction: column;
        width: min(23rem, calc(100vw - 2rem));
        overflow: hidden;
        background: var(--paper);
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 0.9rem;
        box-shadow: var(--shadow);
      }

      .panel-header {
        padding: 1.15rem 1.15rem 0.8rem;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 0.3rem;
        color: var(--green);
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .panel-header h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.42rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .panel-header p {
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .stats {
        display: flex;
        align-items: baseline;
        gap: 0.35rem;
        margin-top: 0.85rem;
        color: var(--muted);
        font-size: 0.75rem;
      }

      .stats strong {
        color: var(--ink);
        font-size: 1.1rem;
      }

      .filters {
        display: flex;
        gap: 0.4rem;
        padding: 0.75rem 1.15rem 0.7rem;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .filter-button {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.62rem;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 99rem;
        cursor: pointer;
        font-size: 0.7rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .filter-button[aria-pressed="true"] {
        color: var(--paper-solid);
        background: var(--green);
        border-color: var(--green);
      }

      .filter-dot {
        width: 0.48rem;
        height: 0.48rem;
        background: currentColor;
        border-radius: 50%;
      }

      .place-list {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.55rem;
        padding: 0.15rem 0.8rem 1rem 1.15rem;
        overflow: auto;
        scrollbar-color: rgba(29, 48, 48, 0.22) transparent;
      }

      .place-card {
        display: block;
        width: 100%;
        padding: 0.72rem 0.75rem;
        color: var(--ink);
        text-align: left;
        background: rgba(255, 255, 255, 0.54);
        border: 1px solid transparent;
        border-radius: 0.65rem;
        cursor: pointer;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .place-card:hover,
      .place-card.active {
        background: #fff;
        border-color: rgba(47, 104, 97, 0.3);
      }

      .place-card-top {
        display: flex;
        align-items: flex-start;
        gap: 0.55rem;
      }

      .category-dot {
        flex: 0 0 auto;
        width: 0.64rem;
        height: 0.64rem;
        margin-top: 0.29rem;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(29, 48, 48, 0.14);
      }

      .place-card h2 {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.25;
      }

      .place-card p {
        display: -webkit-box;
        margin: 0.32rem 0 0 1.2rem;
        overflow: hidden;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .place-card-meta {
        display: flex;
        gap: 0.55rem;
        margin: 0.45rem 0 0 1.2rem;
        color: #82908a;
        font-size: 0.65rem;
      }

      .empty-state {
        padding: 1rem 0.5rem;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .map-note {
        position: absolute;
        z-index: 700;
        right: 4.5rem;
        bottom: 1rem;
        max-width: min(23rem, calc(100vw - 2rem));
        padding: 0.55rem 0.7rem;
        color: #596b65;
        background: rgba(250, 248, 242, 0.86);
        border-radius: 0.55rem;
        box-shadow: 0 0.5rem 1.5rem rgba(30, 47, 47, 0.1);
        font-size: 0.65rem;
        line-height: 1.35;
        backdrop-filter: blur(8px);
      }

      .map-note a {
        color: var(--green-dark);
        font-weight: 700;
      }

      .detail-panel {
        position: absolute;
        z-index: 950;
        top: 6.1rem;
        right: 1rem;
        display: flex;
        flex-direction: column;
        width: min(22rem, calc(100vw - 2rem));
        max-height: calc(100% - 7.1rem);
        overflow: hidden auto;
        background: var(--paper-solid);
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 0.9rem;
        box-shadow: var(--shadow);
      }

      .detail-panel[hidden] {
        display: none;
      }

      .detail-content {
        padding: 1.2rem;
      }

      .detail-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .detail-top h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.45rem;
        line-height: 1.12;
      }

      .close-button {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        color: var(--muted);
        background: #edf1ed;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
      }

      .close-button svg {
        width: 1rem;
        height: 1rem;
      }

      .detail-category {
        display: inline-block;
        margin: 0.9rem 0 0;
        color: var(--green);
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-description {
        margin: 1rem 0 0;
        color: #53645f;
        font-size: 0.82rem;
        line-height: 1.6;
      }

      .detail-text {
        margin: 0.75rem 0 0;
        color: #53645f;
        font-size: 0.82rem;
        line-height: 1.6;
      }

      .detail-meta {
        display: grid;
        gap: 0.6rem;
        margin: 1rem 0 0;
        padding: 0.9rem 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .meta-row {
        display: flex;
        gap: 0.6rem;
        align-items: flex-start;
        color: var(--muted);
        font-size: 0.74rem;
        line-height: 1.4;
      }

      .meta-row strong {
        min-width: 4.2rem;
        color: var(--ink);
        font-weight: 700;
      }

      .detail-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 1rem;
      }

      .detail-link {
        display: inline-flex;
        align-items: center;
        min-height: 2.25rem;
        padding: 0 0.72rem;
        color: var(--paper-solid);
        background: var(--green);
        border-radius: 0.55rem;
        font-size: 0.72rem;
        font-weight: 750;
        text-decoration: none;
      }

      .detail-link.secondary {
        color: var(--green-dark);
        background: #e8efeb;
      }

      .loading {
        position: absolute;
        z-index: 1100;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--ink);
        background: rgba(215, 226, 220, 0.8);
        font-size: 0.9rem;
        font-weight: 700;
        backdrop-filter: blur(4px);
      }

      .loading[hidden] {
        display: none;
      }

      .marker-pin {
        display: grid;
        place-items: center;
        width: 1.65rem;
        height: 1.65rem;
        color: #fff;
        background: var(--marker-color, #2f6861);
        border: 3px solid rgba(255, 255, 255, 0.94);
        border-radius: 50% 50% 50% 0;
        box-shadow: 0 0.25rem 0.65rem rgba(30, 47, 47, 0.3);
        font-size: 0.64rem;
        font-weight: 800;
        transform: rotate(-45deg);
      }

      .marker-pin span {
        transform: rotate(45deg);
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--paper-solid);
      }

      .leaflet-popup-content-wrapper {
        border-radius: 0.65rem;
      }

      .leaflet-popup-content {
        margin: 0.85rem 0.9rem;
      }

      .popup-title {
        margin: 0;
        color: var(--ink);
        font-size: 0.88rem;
        font-weight: 800;
        line-height: 1.25;
      }

      .popup-category {
        margin: 0.25rem 0 0;
        color: var(--green);
        font-size: 0.64rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .popup-action {
        display: inline-block;
        margin-top: 0.55rem;
        color: var(--green-dark);
        font-size: 0.7rem;
        font-weight: 800;
        text-decoration: none;
      }

      @media (max-width: 760px) {
        .topbar {
          top: 0.7rem;
          right: 0.7rem;
          left: 0.7rem;
          flex-wrap: wrap;
          gap: 0.5rem;
        }

        .brand {
          min-width: 0;
          padding: 0.55rem 0.7rem;
        }

        .brand strong {
          font-size: 1.08rem;
        }

        .brand span {
          font-size: 0.56rem;
        }

        .search-box {
          order: 3;
          flex-basis: 100%;
          max-width: none;
        }

        .top-actions {
          margin-left: auto;
        }

        .text-button {
          width: 2.7rem;
          padding: 0;
          font-size: 0;
        }

        .panel {
          top: 8.1rem;
          right: 0.7rem;
          bottom: 0.7rem;
          left: 0.7rem;
          width: auto;
        }

        .detail-panel {
          top: auto;
          right: 0.7rem;
          bottom: 0.7rem;
          left: 0.7rem;
          width: auto;
          max-height: 52vh;
        }

        .map-note {
          right: 4.2rem;
          bottom: 0.7rem;
          max-width: 15rem;
        }
      }

      @media (max-width: 430px) {
        .panel {
          top: 8.65rem;
        }

        .panel-header {
          padding: 0.9rem 0.9rem 0.65rem;
        }

        .filters {
          padding-left: 0.9rem;
        }

        .place-list {
          padding-left: 0.9rem;
        }

        .map-note {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="map" aria-label="Vištyčio regioninio parko žemėlapis"></div>

      <header class="topbar">
        <a class="brand" href="./" aria-label="Grįžti į žemėlapio pradžią">
          <strong>Vištytis</strong>
          <span>interaktyvus žemėlapis</span>
        </a>

        <label class="search-box" for="search-input">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="Ieškoti vietos, miestelio ar temos..."
            aria-label="Ieškoti lankytinos vietos"
          >
        </label>

        <div class="top-actions">
          <button class="text-button" id="fit-all" type="button" title="Rodyti visas vietas">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
            <span>Rodyti visas</span>
          </button>
          <button class="icon-button" id="locate-me" type="button" title="Rodyti mano vietą" aria-label="Rodyti mano vietą">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"></circle>
              <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
      </header>

      <aside class="panel" aria-label="Lankytinų vietų sąrašas">
        <div class="panel-header">
          <p class="eyebrow">Atrask Suvalkijos kampelį</p>
          <h1>Lankytinos vietos</h1>
          <p>Gamta, kultūros paveldas ir poilsio vietos viename žemėlapyje.</p>
          <div class="stats" aria-live="polite">
            <strong id="visible-count">–</strong>
            <span id="count-label">vietų rodoma</span>
          </div>
        </div>
        <div class="filters" id="filters" aria-label="Kategorijų filtrai"></div>
        <div class="place-list" id="place-list" tabindex="0"></div>
      </aside>

      <aside class="detail-panel" id="detail-panel" aria-live="polite" hidden></aside>

      <div class="map-note">
        Žemėlapio pagrindas:
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>.
        Informacija:
        <a href="https://vistytis.lt/" target="_blank" rel="noreferrer">vistytis.lt</a>.
      </div>

      <div class="loading" id="loading">Kraunami žemėlapio duomenys…</div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      (() => {
        "use strict";

        const CATEGORY_META = {
          "Gamta": { color: "#4e9070", short: "G" },
          "Kultūros paveldas": { color: "#b8775b", short: "K" },
          "Apžvalgos vietos": { color: "#4e8da2", short: "A" },
          "Takai": { color: "#b88b3f", short: "T" },
          "Poilsis ir nakvynė": { color: "#866db0", short: "P" },
          "Lankytojų paslaugos": { color: "#bd6381", short: "L" },
          "Lankytinos vietos": { color: "#667d79", short: "V" }
        };

        const PARK_SOURCE = "https://vistytis.lt/";
        const state = {
          places: [],
          activeCategories: new Set(),
          selectedKey: null,
          markers: new Map(),
          map: null,
          allBounds: null,
          userLocation: null
        };

        const elements = {
          loading: document.getElementById("loading"),
          filters: document.getElementById("filters"),
          list: document.getElementById("place-list"),
          visibleCount: document.getElementById("visible-count"),
          countLabel: document.getElementById("count-label"),
          search: document.getElementById("search-input"),
          details: document.getElementById("detail-panel"),
          fitAll: document.getElementById("fit-all"),
          locate: document.getElementById("locate-me")
        };

        const escapeHtml = (value) =>
          String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

        const normalize = (value) =>
          String(value ?? "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLocaleLowerCase("lt-LT");

        const categoryMeta = (place) =>
          CATEGORY_META[place.categories?.[0]] || CATEGORY_META["Lankytinos vietos"];

        const placeMatches = (place, term) => {
          if (!term) return true;
          const haystack = normalize([
            place.name,
            place.city,
            place.municipality,
            place.address,
            place.text,
            ...(place.topics || []),
            ...(place.categories || [])
          ].join(" "));
          return haystack.includes(normalize(term));
        };

        const filteredPlaces = () => {
          const term = elements.search.value.trim();
          return state.places.filter((place) => {
            const categoryMatch = (place.categories || []).some((category) =>
              state.activeCategories.has(category)
            );
            return categoryMatch && placeMatches(place, term);
          });
        };

        const locationLabel = (place) =>
          [place.city, place.municipality].filter(Boolean).join(" · ") || "Vištyčio regioninis parkas";

        const categoryLabel = (place) =>
          (place.categories || []).slice(0, 2).join(" · ") || "Lankytina vieta";

        const markerIcon = (place) => {
          const meta = categoryMeta(place);
          return L.divIcon({
            className: "",
            html: `<span class="marker-pin" style="--marker-color:${meta.color}" title="${escapeHtml(place.name)}"><span>${meta.short}</span></span>`,
            iconSize: [26, 34],
            iconAnchor: [13, 34],
            popupAnchor: [0, -32]
          });
        };

        const popupContent = (place) => `
          <div>
            <p class="popup-title">${escapeHtml(place.name)}</p>
            <p class="popup-category">${escapeHtml(categoryLabel(place))}</p>
            <a class="popup-action" href="#" data-place-key="${escapeHtml(place._key)}">Atverti informaciją →</a>
          </div>
        `;

        const renderFilters = () => {
          const categories = [...new Set(
            state.places.flatMap((place) => place.categories || [])
          )].sort((a, b) => a.localeCompare(b, "lt"));
          state.activeCategories = new Set(categories);
          elements.filters.innerHTML = [
            `<button class="filter-button" type="button" data-category="__all" aria-pressed="true">Visos</button>`,
            ...categories.map((category) => {
              const meta = CATEGORY_META[category] || CATEGORY_META["Lankytinos vietos"];
              return `<button class="filter-button" type="button" data-category="${escapeHtml(category)}" aria-pressed="true">
                <span class="filter-dot" style="color:${meta.color}" aria-hidden="true"></span>${escapeHtml(category)}
              </button>`;
            })
          ].join("");

          elements.filters.querySelectorAll(".filter-button").forEach((button) => {
            button.addEventListener("click", () => {
              const category = button.dataset.category;
              if (category === "__all") {
                state.activeCategories = new Set(categories);
              } else if (state.activeCategories.has(category)) {
                state.activeCategories.delete(category);
              } else {
                state.activeCategories.add(category);
              }
              updateFilterButtons();
              renderPlaces();
              updateMarkers();
            });
          });
        };

        const updateFilterButtons = () => {
          const allActive = state.activeCategories.size === new Set(
            state.places.flatMap((place) => place.categories || [])
          ).size;
          elements.filters.querySelectorAll(".filter-button").forEach((button) => {
            const category = button.dataset.category;
            const pressed = category === "__all"
              ? allActive
              : state.activeCategories.has(category);
            button.setAttribute("aria-pressed", String(pressed));
          });
        };

        const renderPlaces = () => {
          const places = filteredPlaces();
          elements.visibleCount.textContent = places.length;
          elements.countLabel.textContent = places.length === 1 ? "vieta rodoma" : "vietos rodomos";

          if (!places.length) {
            elements.list.innerHTML = `
              <div class="empty-state">
                Pagal pasirinktus filtrus vietų nerasta. Pakeiskite paiešką arba įjunkite kitą kategoriją.
              </div>
            `;
            return;
          }

          elements.list.innerHTML = places.map((place) => {
            const meta = categoryMeta(place);
            return `
              <button class="place-card${state.selectedKey === place._key ? " active" : ""}" type="button" data-place-key="${escapeHtml(place._key)}">
                <span class="place-card-top">
                  <span class="category-dot" style="background:${meta.color}" aria-hidden="true"></span>
                  <span>
                    <h2>${escapeHtml(place.name)}</h2>
                  </span>
                </span>
                <p>${escapeHtml(place.description)}</p>
                <span class="place-card-meta">
                  <span>${escapeHtml(locationLabel(place))}</span>
                </span>
              </button>
            `;
          }).join("");

          elements.list.querySelectorAll(".place-card").forEach((card) => {
            card.addEventListener("click", () => selectPlace(card.dataset.placeKey, true));
          });
        };

        const updateMarkers = () => {
          const visibleKeys = new Set(filteredPlaces().map((place) => place._key));
          state.markers.forEach((marker, key) => {
            if (visibleKeys.has(key)) {
              marker.addTo(state.map);
            } else {
              marker.remove();
            }
          });
        };

        const renderDetails = (place) => {
          const coordinateText = place.coordinates
            ? `${place.coordinates[1].toFixed(5)}, ${place.coordinates[0].toFixed(5)}`
            : "Koordinatės nepatvirtintos";
          const mapsUrl = place.coordinates
            ? `https://www.google.com/maps/search/?api=1&query=${place.coordinates[1]},${place.coordinates[0]}`
            : "";

          elements.details.innerHTML = `
            <div class="detail-content">
              <div class="detail-top">
                <div>
                  <p class="eyebrow">Vištyčio regioninis parkas</p>
                  <h2>${escapeHtml(place.name)}</h2>
                </div>
                <button class="close-button" id="close-details" type="button" aria-label="Uždaryti informaciją">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                  </svg>
                </button>
              </div>
              <p class="detail-category">${escapeHtml(categoryLabel(place))}</p>
              <p class="detail-description">${escapeHtml(place.description)}</p>
              <p class="detail-text">${escapeHtml(place.text || place.description)}</p>
              <div class="detail-meta">
                ${place.address ? `<div class="meta-row"><strong>Adresas</strong><span>${escapeHtml(place.address)}</span></div>` : ""}
                <div class="meta-row"><strong>Vieta</strong><span>${escapeHtml(locationLabel(place))}</span></div>
                <div class="meta-row"><strong>Temos</strong><span>${escapeHtml((place.topics || []).join(", ") || "–")}</span></div>
                <div class="meta-row"><strong>Taškai</strong><span>${escapeHtml(coordinateText)}</span></div>
              </div>
              <div class="detail-links">
                ${mapsUrl ? `<a class="detail-link" href="${mapsUrl}" target="_blank" rel="noreferrer">Naviguoti</a>` : ""}
                <a class="detail-link secondary" href="${PARK_SOURCE}" target="_blank" rel="noreferrer">Parko svetainė</a>
              </div>
            </div>
          `;
          elements.details.hidden = false;
          document.getElementById("close-details").addEventListener("click", closeDetails);
        };

        const selectPlace = (key, flyTo = false) => {
          const place = state.places.find((item) => item._key === key);
          if (!place) return;
          state.selectedKey = key;
          renderPlaces();
          renderDetails(place);
          const marker = state.markers.get(key);
          if (marker) {
            if (flyTo && place.coordinates) {
              state.map.flyTo([place.coordinates[1], place.coordinates[0]], Math.max(state.map.getZoom(), 14), {
                duration: 0.7
              });
            }
            marker.openPopup();
          }
        };

        const closeDetails = () => {
          state.selectedKey = null;
          elements.details.hidden = true;
          renderPlaces();
          state.markers.forEach((marker) => marker.closePopup());
        };

        const fitAll = () => {
          if (state.allBounds && state.allBounds.isValid()) {
            state.map.fitBounds(state.allBounds.pad(0.12), { maxZoom: 14 });
          }
        };

        const addMarkers = () => {
          const bounds = [];
          state.places.forEach((place) => {
            if (!place.coordinates || place.coordinates.length !== 2) return;
            const [longitude, latitude] = place.coordinates;
            const marker = L.marker([latitude, longitude], {
              icon: markerIcon(place),
              title: place.name,
              alt: place.name
            });
            marker.bindPopup(popupContent(place), { closeButton: true });
            marker.on("popupopen", () => {
              const link = [...document.querySelectorAll(".popup-action")]
                .find((element) => element.dataset.placeKey === place._key);
              if (link && link.classList.contains("popup-action")) {
                link.addEventListener("click", (event) => {
                  event.preventDefault();
                  selectPlace(place._key, false);
                }, { once: true });
              }
            });
            marker.on("click", () => selectPlace(place._key, false));
            state.markers.set(place._key, marker);
            bounds.push([latitude, longitude]);
          });
          if (bounds.length) state.allBounds = L.latLngBounds(bounds);
        };

        const initializeMap = () => {
          state.map = L.map("map", {
            zoomControl: false,
            preferCanvas: true,
            minZoom: 8,
            maxZoom: 18
          }).setView([54.47, 22.72], 12);

          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }).addTo(state.map);
          L.control.zoom({ position: "bottomright" }).addTo(state.map);
        };

        const showLocation = () => {
          if (!navigator.geolocation) {
            window.alert("Ši naršyklė nepalaiko vietos nustatymo.");
            return;
          }
          elements.locate.disabled = true;
          state.map.locate({ setView: true, maxZoom: 15, enableHighAccuracy: true });
          state.map.once("locationfound", (event) => {
            elements.locate.disabled = false;
            if (state.userLocation) state.userLocation.remove();
            state.userLocation = L.circleMarker(event.latlng, {
              radius: 8,
              color: "#fff",
              weight: 3,
              fillColor: "#2f6861",
              fillOpacity: 1
            }).addTo(state.map).bindTooltip("Jūsų vieta");
          });
          state.map.once("locationerror", () => {
            elements.locate.disabled = false;
            window.alert("Nepavyko nustatyti jūsų vietos. Patikrinkite naršyklės leidimą.");
          });
        };

        const showLoadError = (error) => {
          elements.loading.hidden = false;
          elements.loading.textContent = "Duomenų nepavyko įkelti. Paleiskite puslapį per HTTP serverį.";
          console.error(error);
        };

        const wireEvents = () => {
          elements.search.addEventListener("input", () => {
            renderPlaces();
            updateMarkers();
          });
          elements.fitAll.addEventListener("click", fitAll);
          elements.locate.addEventListener("click", showLocation);
          elements.details.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeDetails();
          });
        };

        const start = async () => {
          try {
            initializeMap();
            wireEvents();
            const placesResponse = await fetch("data/places.json", { cache: "no-store" });
            if (!placesResponse.ok) throw new Error(`Places request failed: ${placesResponse.status}`);
            const payload = await placesResponse.json();
            const rawPlaces = Array.isArray(payload)
              ? payload
              : Array.isArray(payload.places)
                ? payload.places
                : [];
            state.places = rawPlaces.map((place, index) => ({
              ...place,
              _key: String(index)
            }));
            if (!state.places.length) throw new Error("No places found in data/places.json");
            renderFilters();
            addMarkers();
            renderPlaces();
            updateMarkers();
            fitAll();
            elements.loading.hidden = true;
            setTimeout(() => state.map.invalidateSize(), 120);
          } catch (error) {
            showLoadError(error);
          }
        };

        start();
      })();
    </script>
  </body>
</html>
